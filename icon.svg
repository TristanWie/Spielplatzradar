<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Hintergrund -->
  <rect width="512" height="512" fill="#fef5f1"/>
  
  <!-- Äußerer Kreis -->
  <circle cx="256" cy="256" r="240" fill="#ecfdf5" stroke="#059669" stroke-width="12"/>
  
  <!-- Innerer Spielplatz-Symbol -->
  <g transform="translate(256, 256)">
    <!-- Schaukel -->
    <line x1="-80" y1="-100" x2="-80" y2="20" stroke="#059669" stroke-width="8" stroke-linecap="round"/>
    <line x1="80" y1="-100" x2="80" y2="20" stroke="#059669" stroke-width="8" stroke-linecap="round"/>
    <rect x="-100" y="-120" width="200" height="20" fill="#059669" rx="10"/>
    
    <!-- Schaukelsitz -->
    <ellipse cx="-80" cy="30" rx="25" ry="20" fill="#10b981"/>
    <ellipse cx="80" cy="30" rx="25" ry="20" fill="#10b981"/>
    
    <!-- Rutsche -->
    <rect x="20" y="-60" width="60" height="100" fill="none" stroke="#059669" stroke-width="8" stroke-linecap="round"/>
    <path d="M 50 -60 Q 80 0 90 70" fill="none" stroke="#059669" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Punkt (Familie/Freunde Symbol) -->
    <circle cx="-60" cy="80" r="30" fill="#fbbf24" stroke="#059669" stroke-width="6"/>
    <circle cx="60" cy="80" r="30" fill="#60a5fa" stroke="#059669" stroke-width="6"/>
    <circle cx="0" cy="110" r="30" fill="#f87171" stroke="#059669" stroke-width="6"/>
  </g>
  
  <!-- Pulsierender Punkt (optional, nur für Vorschau) -->
  <circle cx="256" cy="256" r="8" fill="#059669" opacity="0.5"/>
</svg>
