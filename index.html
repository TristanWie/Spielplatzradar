<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Spielplatzradar" />
  <link rel="apple-touch-icon" href="./assets/icon-180.png" />
  <meta name="theme-color" content="#fef5f1" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="description" content="Spielplatzradar - Echtzeitkoordinierung mit Freunden auf dem Spielplatz" />

  <title>Spielplatzradar</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>

  <div id="lade-anzeige" class="lade-anzeige">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" class="drehend" style="color:var(--farbe-primaer)">
      <path d="M21 12a9 9 0 1 1-6.219-8.56" />
    </svg>
  </div>

  <div id="onboarding" class="onboarding" style="display:none">
    <div class="stapel-klein">
      <div class="onboarding-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0Z" />
          <circle cx="12" cy="10" r="3" />
        </svg>
      </div>
      <h1>Spielplatzradar</h1>
      <p class="untertitel">Schau, wer gerade im Park ist</p>
    </div>

    <form id="onboarding-formular">
      <div>
        <label for="eingabe-name">Dein Name</label>
        <input type="text" id="eingabe-name" placeholder="z. B. Anna" autocomplete="name" required />
      </div>

      <div>
        <label for="eingabe-code">Gruppen-Code</label>
        <input type="text" id="eingabe-code" placeholder="z. B. Familie Müller" required />
        <p class="hinweis">Alle mit dem gleichen Code sehen sich gegenseitig</p>
      </div>

      <button type="submit" class="btn btn-primaer">Los geht's</button>
    </form>
  </div>

  <!-- Firebase (compat-Version, funktioniert direkt mit <script>-Tags) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
  <script src="./firebase-config.js"></script>
  <script src="./js/gemeinsam.js"></script>

  <script>
    // Schon ein Profil vorhanden? Dann direkt zum Live-Tab weiterleiten.
    // Sonst: Onboarding-Formular zeigen.
    const bestehendesProfil = ladeProfil();

    document.getElementById("lade-anzeige").style.display = "none";

    if (bestehendesProfil) {
      window.location.href = "./live.html";
    } else {
      document.getElementById("onboarding").style.display = "flex";

      document.getElementById("onboarding-formular").addEventListener("submit", function (event) {
        event.preventDefault();
        const name = document.getElementById("eingabe-name").value.trim();
        const code = document.getElementById("eingabe-code").value.trim();
        if (!name || !code) return;

        const neuesProfil = {
          name: name,
          code: code,
          groupId: saeubereGruppenCode(code),
          deviceId: neueId(),
        };
        speichereProfil(neuesProfil);
        window.location.href = "./live.html";
      });
    }
  </script>
</body>
</html>
